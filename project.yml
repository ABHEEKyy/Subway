name: Subway
options:
  bundleIdPrefix: com.abheek
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 48CSUH83VC

targets:
  Subway:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Subway
    settings:
      base:
        PRODUCT_NAME: Subway
        PRODUCT_BUNDLE_IDENTIFIER: com.abheek.subway
        INFOPLIST_FILE: Subway/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
